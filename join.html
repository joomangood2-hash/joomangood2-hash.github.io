<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 | 블록타운 - 부동산 경매 조각투자 · 소득공제형 벤처투자</title>
<meta name="description" content="정부 인증 벤처기업 (주)업타운의 부동산 경매 조각투자 플랫폼 블록타운. 성과연동형 전환사채(CB) 투자로 소득공제(조세특례제한법 제16조)와 성과배분을 함께.">
<meta property="og:title" content="블록타운 - 부동산 경매 조각투자"><meta property="og:description" content="세금은 돌려받고, 원금은 부동산으로 지키는 벤처투자">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23071B53%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22900%22>B</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/data.js"></script><script src="assets/js/common.js"></script>
</head><body>
<div id="hd"></div>
<section class="sec alt"><div class="wrap">
 <div class="form-card" style="max-width:620px"><h2>회원가입</h2><p class="desc">만 19세 이상 개인 회원 가입 · 가입 후 상품 상세 정보와 투자 신청을 이용할 수 있습니다.</p>
 <form id="f" novalidate>
  <div class="agree"><label class="chk all"><input type="checkbox" id="agAll">약관 전체 동의</label>
   <label class="chk"><input type="checkbox" class="ag" name="a1" required>[필수] <a href="terms.html" target="_blank" style="text-decoration:underline">이용약관</a> 동의</label>
   <label class="chk"><input type="checkbox" class="ag" name="a2" required>[필수] <a href="privacy.html" target="_blank" style="text-decoration:underline">개인정보 수집·이용</a> 동의</label>
   <label class="chk"><input type="checkbox" class="ag" name="a3" required>[필수] 만 19세 이상이며 <a href="risk.html" target="_blank" style="text-decoration:underline">투자위험 고지</a>를 확인했습니다.</label>
   <label class="chk"><input type="checkbox" class="ag" name="mkt">[선택] 신규 상품·이벤트 알림(SMS/이메일) 수신 동의</label></div>
  <div class="f"><label>아이디</label><div style="display:flex;gap:8px"><input name="id" required placeholder="영문/숫자 4~16자"><button type="button" class="btn btn-o" id="dup">중복확인</button></div><div class="help" id="idh"></div></div>
  <div class="f"><label>비밀번호</label><input name="pw" type="password" required placeholder="영문+숫자 8자 이상"></div>
  <div class="f"><label>비밀번호 확인</label><input name="pw2" type="password" required></div>
  <div class="f"><label>이름</label><input name="name" required></div>
  <div class="f"><label>생년월일</label><input name="birth" type="date" required></div>
  <div class="f"><label>휴대폰 번호</label><div style="display:flex;gap:8px"><input name="phone" required placeholder="010-0000-0000"><button type="button" class="btn btn-o" id="cert">본인인증</button></div><div class="help">실서비스에서는 PASS 등 휴대폰 본인인증이 연동됩니다.</div></div>
  <div class="f"><label>이메일</label><input name="email" type="email" required></div>
  <div class="f"><label>주소</label><div style="display:flex;gap:8px"><input name="zip" placeholder="우편번호" readonly style="max-width:140px"><button type="button" class="btn btn-o" id="post">주소 검색</button></div><input name="addr" class="mt8" placeholder="기본 주소"><input name="addr2" class="mt8" placeholder="상세 주소"></div>
  <div class="f"><label>가입 경로 (선택)</label><select name="ref"><option value="">선택</option><option>지인 소개</option><option>검색</option><option>블로그/카페</option><option>세미나</option><option>기존 블록타운 투자자</option></select></div>
  <div class="help err" id="err"></div>
  <button class="btn btn-p btn-lg" style="width:100%">가입하기</button>
 </form><div class="links">이미 회원이신가요? <a href="login.html"><b>로그인</b></a></div></div>
</div></section>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" async></script>
<div id="ft"></div>
<script>document.addEventListener('DOMContentLoaded',()=>{
 const f=BT.$('#f'); let checked='';
 BT.$('#agAll').onchange=e=>BT.$$('.ag').forEach(c=>c.checked=e.target.checked);
 BT.$('#dup').onclick=()=>{ const id=f.id.value.trim(), h=BT.$('#idh'); if(!/^[a-z0-9]{4,16}$/i.test(id)){h.textContent='영문/숫자 4~16자로 입력해 주세요.';h.className='help err';return;} if(BT.users().some(u=>u.id===id)){h.textContent='이미 사용 중인 아이디입니다.';h.className='help err';return;} checked=id; h.textContent='사용 가능한 아이디입니다.'; h.className='help'; h.style.color='var(--green)'; };
 BT.$('#cert').onclick=()=>BT.toast('데모: 본인인증이 완료된 것으로 처리됩니다.');
 BT.$('#post').onclick=()=>{ if(window.daum&&daum.Postcode){ new daum.Postcode({oncomplete:d=>{f.zip.value=d.zonecode;f.addr.value=d.roadAddress||d.jibunAddress;f.addr2.focus();}}).open(); } else { BT.toast('주소 검색을 불러오지 못했습니다. 직접 입력해 주세요.'); f.addr.focus(); } };
 f.onsubmit=e=>{ e.preventDefault(); const er=BT.$('#err'); er.textContent='';
  for(const el of BT.$$('[required]',f)){ if(el.type==='checkbox'?!el.checked:!el.value.trim()){ er.textContent=el.type==='checkbox'?'필수 약관에 동의해 주세요.':'필수 항목을 모두 입력해 주세요.'; el.focus(); return; } }
  if(checked!==f.id.value.trim()){ er.textContent='아이디 중복확인을 해 주세요.'; return; }
  if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(f.pw.value)){ er.textContent='비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.'; return; }
  if(f.pw.value!==f.pw2.value){ er.textContent='비밀번호가 일치하지 않습니다.'; return; }
  const age=(Date.now()-new Date(f.birth.value))/31557600000; if(age<19){ er.textContent='만 19세 이상만 가입할 수 있습니다.'; return; }
  if(!/^01[0-9]-?\d{3,4}-?\d{4}$/.test(f.phone.value)){ er.textContent='휴대폰 번호 형식을 확인해 주세요.'; return; }
  BT.saveUser({id:f.id.value.trim(),pw:BT.hash(f.pw.value),name:f.name.value.trim(),birth:f.birth.value,phone:f.phone.value,email:f.email.value,addr:[f.zip.value,f.addr.value,f.addr2.value].filter(Boolean).join(' '),ref:f.ref.value,mkt:f.mkt.checked,joined:new Date().toISOString().slice(0,10)});
  BT.S.set('bt_session',f.id.value.trim()); alert('회원가입이 완료되었습니다. 블록타운에 오신 것을 환영합니다!'); location.href='mypage.html'; };
});</script></body></html>
